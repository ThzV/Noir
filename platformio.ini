; ============================================================================
;  Noir OS  -  M5Stack Cardputer v1.1
;  MCU: ESP32-S3FN8  |  8 MB flash  |  SEM PSRAM
;
;  Build system: PlatformIO + Arduino (framework).
;  Plataforma: pioarduino (fork do espressif32, o mesmo usado pelo Bruce),
;  que habilita o Arduino-core 3.x no ESP32-S3.
;
;  Documentacao de setup: docs/02-ambiente-dev.md
; ============================================================================

[platformio]
default_envs = m5stack-cardputer

[env:m5stack-cardputer]
; Se o download da plataforma falhar (404) ou voce quiser uma versao mais nova,
; veja as releases em:
;   https://github.com/pioarduino/platform-espressif32/releases
; e troque a versao no fim da URL abaixo.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip

; O Cardputer usa o modulo StampS3. Usamos um board S3 generico + flash 8 MB
; explicito (garante resolucao do board em qualquer versao da plataforma).
; Se sua plataforma tiver "m5stack-stamps3", pode trocar por ele.
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.partitions = partitions/custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

; USB nativo do ESP32-S3 (sem chip conversor). CDC no boot = porta serial + logs.
build_flags =
    -I src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; O modulo Rede/Ofensivo redefine ieee80211_raw_frame_sanity_check() para
    ; liberar a injecao 802.11 (beacon/deauth). No arduino-esp32 3.x isso colide
    ; com o simbolo do SDK; este flag faz o linker aceitar a nossa definicao.
    -Wl,--allow-multiple-definition

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; M5Cardputer puxa M5Unified + M5GFX (tela, teclado, energia, audio).
; ArduinoJson entra agora para os futuros modulos de Servidor/Home.
lib_deps =
    m5stack/M5Cardputer
    bblanchon/ArduinoJson @ ^7.0.0
    h2zero/NimBLE-Arduino @ ^2.0.0
    marian-craciunescu/ESP32Ping
